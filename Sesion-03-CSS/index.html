<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aficionados FC — Tienda Oficial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Aficionados FC</h1>

        <section class="galeria">

            <article class="producto">
                <img src="https://placehold.co/300x200/8a1f1f/ffffff?text=Camisola+Municipal" alt="Camisola oficial de CSD Municipal">
                <div class="producto-info">
                    <h2>Camisola CSD Municipal</h2>
                    <p class="precio">Q349.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://placehold.co/300x200/1f3a5f/ffffff?text=Camisola+Comunicaciones" alt="Camisola oficial de Comunicaciones FC">
                <div class="producto-info">
                    <h2>Camisola Comunicaciones FC</h2>
                    <p class="precio">Q349.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://placehold.co/300x200/4a3b28/ffffff?text=Camisola+Xelaju" alt="Camisola oficial de Xelajú MC">
                <div class="producto-info">
                    <h2>Camisola Xelajú MC</h2>
                    <p class="precio">Q329.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://placehold.co/300x200/2b2620/ffffff?text=Bufanda+Clasico" alt="Bufanda conmemorativa del Clásico Nacional">
                <div class="producto-info">
                    <h2>Bufanda Clásico Nacional</h2>
                    <p class="precio">Q129.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://placehold.co/300x200/8a1f1f/ffffff?text=Gorra+Seleccion" alt="Gorra oficial de la Selección Nacional">
                <div class="producto-info">
                    <h2>Gorra Selección Nacional</h2>
                    <p class="precio">Q99.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://placehold.co/300x200/1f3a5f/ffffff?text=Balon+Oficial" alt="Balón oficial de la Liga Nacional">
                <div class="producto-info">
                    <h2>Balón Oficial Liga Nacional</h2>
                    <p class="precio">Q259.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <h2>Lista para el día del partido</h2>

        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Comprar el boleto para la grada</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Sacar la camisola del equipo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Confirmar transporte con la barra</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Revisar el clima antes de salir</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Cargar la batería de la cámara</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
